# Deploys the interactive prototype (repo-root index.html) to GitHub Pages.
# `actions/configure-pages` with enablement:true turns Pages ON automatically,
# so no manual Settings → Pages toggle is needed.
name: Deploy prototype to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/feature-me-app-spec-5ndzy6
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages (enables Pages if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact (repo root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
